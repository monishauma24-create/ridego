<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RideGo - Ride Booking</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            RideGo
        </div>

        <nav>
            <a href="#home">Home</a>
            <a href="#register">Register</a>
            <a href="#book">Book Ride</a>
            <a href="#rides">My Rides</a>
        </nav>

    </header>


    <!-- Home -->
    <section id="home" class="hero">

        <div class="hero-content">

            <h1>Ride Anywhere, Anytime</h1>

            <p>
                Simple, fast and reliable ride booking.
            </p>

            <a href="#book" class="button">
                Book a Ride
            </a>

        </div>

    </section>


    <!-- Register -->
    <section id="register" class="section">

        <div class="card">

            <h2>Create Account</h2>

            <p class="subtitle">
                Register before booking your ride.
            </p>

            <form id="registerForm">

                <input
                    type="text"
                    id="registerName"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="tel"
                    id="registerPhone"
                    placeholder="Phone Number"
                    required
                >

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Register
                </button>

            </form>

            <div id="registerResult" class="result"></div>

        </div>

    </section>


    <!-- Book Ride -->
    <section id="book" class="section">

        <div class="card">

            <h2>Book Your Ride</h2>

            <p class="subtitle">
                Enter your pickup and destination.
            </p>

            <form id="rideForm">

                <input
                    type="text"
                    id="pickup"
                    placeholder="Pickup Location"
                    required
                >

                <input
                    type="text"
                    id="destination"
                    placeholder="Destination"
                    required
                >

                <select id="rideType">

                    <option value="UberGo">
                        UberGo
                    </option>

                    <option value="Premier">
                        Premier
                    </option>

                    <option value="Bike">
                        Bike
                    </option>

                    <option value="Auto">
                        Auto
                    </option>

                </select>

                <button type="submit">
                    Book Ride
                </button>

            </form>

            <div id="result" class="result"></div>

        </div>

    </section>


    <!-- My Rides -->
    <section id="rides" class="section">

        <div class="card rides-card">

            <h2>My Rides</h2>

            <p class="subtitle">
                Your recent ride bookings.
            </p>

            <button
                type="button"
                id="loadRidesButton"
                class="secondary-button"
            >
                Load My Rides
            </button>

            <div id="rideList" class="ride-list"></div>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 RideGo. Ride safely.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
